<!DOCTYPE html>
<html lang="en">   
    <body>
        <h1>My First JavaScript</h1>

        <button type="button" onclick="document.getElementById('demo').innerHTML = Date()">Click me to Display Date and Time</button>

        <p id="demo"></p>

        <input type="text" id="number1" placeholder="Enter number 1"> <br/>
        <input type="text" id="number2" placeholder="Enter number 2"> <br/>
        <button type="button" onclick="getAnswers()">Click to Display All Answers</button><br/>

        <p id="result"></p>

    </body>
</html>

<script>
    function getAnswers() {
        var num1 = parseFloat(document.getElementById("number1").value);
        var num2 = parseFloat(document.getElementById("number2").value);
        var sum = num1 + num2;
        var diff = num1 - num2;
        var product = num1 * num2;
        if (num2 === 0) {
            document.getElementById("result").innerHTML = "Cannot divide by 0";
            return;
        }
        var quotient = num1 / num2;
        document.getElementById("result").innerHTML = "Sum: " + sum + "<br/>Difference: " + diff + "<br/>Product: " + product + "<br/>Quotient: " + quotient;
    }
</script>
