<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Table Example - My Classmates</title>
    </head>

    <body>
        <h1>My Students</h1>

        <table border="1">
            <thead>
                <tr>
                    <th colspan="3" style="text-align: center;">Name</th>
                </tr>

                <tr>
                    <th>Lastname</th>
                    <th>Firstname</th>
                    <th>MiddleName</th>
                    <th>Gender</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Cave</td>
                    <td>Ryan</td>
                    <td>Miranda</td>
                    <td>Male</td>
                </tr>
                <tr>
                    <td>Dela Cruz</td>
                    <td>Lyn</td>
                    <td>Ramos</td>
                    <td>Female</td>
                </tr>
                <tr>
                    <td>Gecobe</td>
                    <td>Francis</td>
                    <td>Castillo</td>
                    <td>Male</td>
                </tr>

            
            </tbody>
        </table>
    </body>
</html>
